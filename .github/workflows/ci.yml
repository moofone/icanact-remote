name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Enforce formatting
        run: cargo fmt --all -- --check
      - name: Enforce strict linting
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Test every feature and target
        run: cargo test --all-features

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      # This library intentionally does not track Cargo.lock. Audit the exact
      # latest-compatible graph a clean standalone checkout resolves today.
      - name: Resolve clean-checkout dependency graph
        run: cargo generate-lockfile
      - name: Audit dependencies
        run: cargo audit
