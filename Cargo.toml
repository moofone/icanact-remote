[package]
name = "icanact-remote"
version = "0.1.0"
edition = "2024"

[features]
test-helpers = []
io_uring = ["tokio-uring", "io-uring"]
strict-zero-copy = []
# Enable verbose `trace!` logging from CorrelationTracker::allocate (success
# and contention messages). Off by default because the dispatcher filter
# check fires on every allocation on the hot path; gating the macro behind a
# feature lets production strip it entirely. Bonus optimisation discovered
# during the slot-leak forensic investigation 2026-05-09.
trace-correlation = []
# UDP datagram transport machinery (GossipRegistry::enable_udp and its
# supporting writer/runtime plumbing). Off by default: enable_udp() always
# fail-closes because per-datagram peer authentication (signature/MAC +
# anti-replay) is not implemented, so the entire code path is dead weight
# for default consumers and previously exposed `udp_mode` as a `pub` field
# that let external code bypass the fail-closed check. Gating it removes
# that bypass and the unreachable surface from default builds.
unstable-udp-transport = []

[dependencies]
crossbeam-queue = "0.3"
arc-swap = { version = "1.7", features = ["weak"] }
bytes = "1.0"
libc = "0.2"
scc = "3.5.6"
lru = "0.12"  # LRU cache for known-peers
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
futures = "0.3"
hex = "0.4"
rand = "0.9.1"
rkyv = { version = "0.8", features = ["bytecheck"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0.12"
tokio = { version = "1.52.1", default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

# TLS and cryptographic dependencies
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = "0.26"
data-encoding = "2.5"  # For BASE32 DNS encoding
zeroize = { version = "1.7", features = ["derive"] }  # For secure key handling
x509-parser = "0.16"  # For parsing X.509 certificates
sha2 = "0.10"  # For deterministic NodeId generation fallback

# Platform-specific dependencies for io_uring support
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
tokio-uring = { version = "0.5", optional = true }
io-uring = { version = "0.6", optional = true }

[dev-dependencies]
anyhow = "1.0"
bytes = "1.0"
criterion = { version = "0.7", features = ["async_tokio"] }
tokio-test = "0.4"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-test = "0.2.5"

[[bench]]
name = "archived_access"
harness = false

[[bench]]
name = "gossip_round"
harness = false

[[bench]]
name = "connect_paths"
harness = false

[[bench]]
name = "pubsub_hotpath"
harness = false

[[bench]]
name = "pubsub_job_pattern"
harness = false

[[test]]
name = "udp_ask_e2e"
path = "tests/udp_ask_e2e.rs"
required-features = ["unstable-udp-transport"]
